<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PO to MoM project results and visualizations">
  <title>PO to MoM | 项目入口</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #233039;
      background: #f5f7f7;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    header { border-bottom: 1px solid #dce3e3; background: #fff; }
    .inner { width: min(100% - 40px, 880px); margin-inline: auto; }
    header .inner { min-height: 64px; display: flex; align-items: center; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    main { padding-block: 48px; }
    h2 { margin: 0 0 22px; font-size: 22px; font-weight: 650; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    nav a {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 76px; padding: 20px 22px; border: 1px solid #d7dfdf;
      border-radius: 6px; background: #fff; color: #233039;
      font-size: 16px; font-weight: 600; text-decoration: none;
    }
    nav a:hover { border-color: #277c6a; background: #f0f8f5; color: #176c5b; }
    nav a:focus-visible { outline: 2px solid #277c6a; outline-offset: 3px; }
    nav a span:last-child { color: #277c6a; font-size: 20px; font-weight: 400; }
    @media (max-width: 600px) {
      .inner { width: min(100% - 32px, 880px); }
      main { padding-block: 32px; }
      nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header><div class="inner"><h1>PO to MoM</h1></div></header>
  <main class="inner">
    <h2>项目内容</h2>
    <nav aria-label="项目网站">
      <a href="https://fishneedlegrandfather.github.io/visual-record/"><span>训练记录</span><span aria-hidden="true">↗</span></a>
      <a href="https://fishneedlegrandfather.github.io/visual-weekly-journal/"><span>Weekly Journal</span><span aria-hidden="true">↗</span></a>
      <a href="https://fishneedlegrandfather.github.io/visual-v6/"><span>V6 可视化</span><span aria-hidden="true">↗</span></a>
      <a href="https://fishneedlegrandfather.github.io/visual-v7/"><span>V7 可视化</span><span aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
